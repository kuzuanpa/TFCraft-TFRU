buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "gt"
            url = "https://gregtech.mechaenetia.com/"
        }
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }

    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') 
    }
}
plugins{
    id 'maven-publish'
}
allprojects {
    apply plugin: 'java'
    apply plugin: 'forge'
    group = group_name
    version = mod_version
    archivesBaseName = "${mod_id}-${minecraft_version}"
    sourceCompatibility = 1.8
    targetCompatibility = 1.8

    minecraft {
        version = minecraft_version + '-' + forge_version
	if(file('../run').exists()) {
		runDir = "../run"
	} else {
		runDir = "run"
		if (!file(runDir).exists()) file(runDir).mkdir()
	}
}


repositories {
    maven {
        name = "gt"
        url = "https://gregtech.mechaenetia.com/"
    }
    maven { // the repo from which to get NEI and stuff 
        name 'CB Repo'
        url "https://chickenbones.net/maven/"
    }
}
    configurations {
        shade
        compile.extendsFrom shade
    }

    dependencies {
	// Forcing version numbers for everything and using NO-NEI WAILA since the "transitive dependency resolution (gradle magic)" is currently borked.
        implementation "thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev"
        implementation "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev"
        implementation "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev"
        implementation "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev"
        implementation "mcp.mobius.waila:Waila:1.5.10_1.7.10:dev"
        implementation "com.azanor.baubles:Baubles:1.7.10-1.0.1.10:deobf"


    }
}

sourceSets {
   main {
     java {
       srcDirs = [ 'src/Common' , 'src/API' , 'src/ASM' ]
	   exclude '**/Resources/'
     }
	 resources {
       srcDirs = [ 'src/Resources' ]
	   exclude '**/API'
	   exclude '**/ASM'
	   exclude '**/Common'
     }
   }
 }

processResources {
//First we just copy in the mcmod.info file
from(sourceSets.main.resources.srcDirs) {
        include '**/*.prop'

        // replaces
        expand ([
            'mod_version': mod_version,
            'tfc_version': project.tfc_version,
            'minecraft_version': project.minecraft_version,
        ])
    }
}
// This task creates a .jar file containing the source code of this mod.
task sourcesJar(type: Jar, dependsOn: classes) {
    classifier = "sources"
    from sourceSets.main.allSource
}

// This task creates a .jar file containing a deobfuscated version of this mod, for other developers to use in a development environment.
task devJar(type: Jar) {
    classifier = "dev"
    from sourceSets.main.output
}

// Creates the listed artifacts on building the mod.
artifacts {
    archives sourcesJar
    archives devJar
}
jar {
    manifest.attributes(
            'FMLCorePlugin': 'com.bioxx.tfc.TFCASMLoadingPlugin',
			'FMLCorePluginContainsFMLMod': 'true',
			'FMLAT': 'tfc_at.cfg'
    )
}


idea { module { inheritOutputDirs = true } }
// This block configures any maven publications you want to make.
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'cn.kuzuanpa'
            artifactId = 'TerraFirmaCraft-TFRU'
            // Add any other artifacts here that you would like to publish!
            artifact(jar) {
                builtBy build
            }
            artifact(sourcesJar) {
                builtBy sourcesJar
            }
            artifact(devJar) {
                builtBy devJar
            }
        }
    }

    // This block selects the repositories you want to publish to.
    repositories {
        mavenLocal()
        // Add the repositories you want to publish to here.
    }
}